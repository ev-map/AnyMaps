ext {
    name = 'AnyMaps - Google Maps'
    artifactId = 'anymaps.google'
    description = 'Google version of AnyMaps'
}

apply plugin: 'com.android.library'
apply plugin: 'maven-publish'
apply from: '../publishing.gradle'

android {
    namespace = "com.car2go.maps.google"

    defaultConfig {
        minSdkVersion 19
        targetSdkVersion 34
        compileSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

dependencies {
    implementation project(':anymaps-base')

    compileOnly 'com.google.android.gms:play-services-maps:19.0.0'
    testImplementation 'com.google.android.gms:play-services-maps:19.0.0'

    testImplementation 'junit:junit:4.13.1'
    testImplementation 'org.powermock:powermock-module-junit4:1.5.2'
    testImplementation 'org.powermock:powermock-api-mockito:1.5.2'
}
